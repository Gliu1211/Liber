[project]
name = "liber"
version = "0.1.0"
description = "Local API proxy that lets you decide what stays in an LLM's context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "anyio>=4.16.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
liber = "liber.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./liber (ARCHITECTURE.md §13), not ./src/liber.
module-root = ""

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# .claude/ holds the owner's protected harness (agents can't edit it), so it is not linted here.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
